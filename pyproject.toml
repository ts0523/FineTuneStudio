[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["build", "dist", ".venv", "promo-film", "promo-studio", "promo-video"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401"]

[tool.mypy]
python_version = "3.12"
files = [
  "studio/core/adapters.py",
  "studio/core/ai.py",
  "studio/core/autotrain.py",
  "studio/core/custom_data.py",
  "studio/core/jobs.py",
  "studio/core/procs.py",
  "studio/core/trust.py",
  "studio/workers/chat_worker.py",
  "studio/workers/custom_model.py",
  "studio/workers/download_worker.py",
  "studio/workers/merge_worker.py",
  "studio/workers/mm_support.py",
]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
exclude = "(^|/)(build|dist|\\.venv|promo-film|promo-studio|promo-video)/"
